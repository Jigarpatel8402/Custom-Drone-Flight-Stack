drone_estimator:
  ros__parameters:
    gyro_weight: 0.9995
    accel_weight: 0.0005
    mag_yaw_weight: 0.02
    gyro_yaw_weight: 0.98

attitude_angle_control:
  ros__parameters:
    kp_roll: 1.0
    ki_roll: 0.0
    kd_roll: 0.0
    kp_pitch: 1.0
    ki_pitch: 0.0
    kd_pitch: 0.0
    kp_yaw: 0.2
    ki_yaw: 0.0
    kd_yaw: 0.0
    max_roll_rate: 10.0
    max_pitch_rate: 10.0
    max_yaw_rate: 5.0

attitude_rate_control:
  ros__parameters:
    kp_roll_rate: 1.0
    ki_roll_rate: 0.0
    kd_roll_rate: 0.15
    kp_pitch_rate: 1.0
    ki_pitch_rate: 0.0
    kd_pitch_rate: 0.15
    kp_yaw_rate: 0.1
    ki_yaw_rate: 0.0
    kd_yaw_rate: 0.0
    max_roll_output: 5.0
    max_pitch_output: 5.0
    max_yaw_output: 3.0

position_control:
  ros__parameters:
    kp_position: 1.0
    ki_position: 0.1
    kd_position: 0.0
    max_velocity: 2.0

altitude_velocity_control:
  ros__parameters:
    hover_throttle: 350.0
    kp_altitude_velocity: 100.0
    ki_altitude_velocity: 10.0
    kd_altitude_velocity: 150.0

xy_velocity_control:
  ros__parameters:
    kp_xy_velocity: 3.0
    max_tilt: 5.0

drone_pwm:
  ros__parameters:
    timer: 0.0

drone_command:
  ros__parameters:
    arm_throttle: 100.0

